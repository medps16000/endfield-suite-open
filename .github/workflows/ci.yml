name: CI

on:
  push:
  pull_request:

jobs:
  public-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check public-source boundary
        run: python scripts/check_public_tree.py
      - name: Compile Python sources
        run: python -m compileall -q endfield-logs endfield-pcap

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install API
        run: |
          python -m pip install -e "./endfield-logs/packages/parser_core"
          python -m pip install -e "./endfield-logs/apps/api[dev]"
      - name: Test API
        working-directory: endfield-logs/apps/api
        run: python -m pytest

  client-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install client
        run: |
          python -m pip install -e ".\endfield-pcap\packages\parser_core"
          python -m pip install -e ".\endfield-logs\packages\uploader_core"
          python -m pip install -e ".\endfield-pcap[dev]"
      - name: Test client
        working-directory: endfield-pcap
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python -m pytest tests

  uploader-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uploader
        run: |
          python -m pip install -e ".\endfield-logs\packages\parser_core"
          python -m pip install -e ".\endfield-logs\packages\uploader_core"
          python -m pip install -e ".\endfield-pcap[dev]"
          python -m pip install -e ".\endfield-logs\apps\uploader[dev]"
      - name: Test uploader
        env:
          QT_QPA_PLATFORM: offscreen
        working-directory: endfield-logs/apps/uploader
        run: python -m pytest

  web-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: endfield-logs/pnpm-lock.yaml
      - name: Install web dependencies
        working-directory: endfield-logs
        run: pnpm install --frozen-lockfile
      - name: Audit web dependencies
        working-directory: endfield-logs
        run: pnpm audit --audit-level high
      - name: Typecheck web
        working-directory: endfield-logs
        run: pnpm --dir apps/web typecheck
      - name: Check source-only resource boundaries
        working-directory: endfield-logs/apps/web
        run: node --test tests/public-runtime-resources.test.mjs
