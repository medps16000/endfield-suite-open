[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "endfield-pcap"
version = "0.1.0"
description = "Endfield packet capture DPS/rDPS overlay"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "dpkt",
  "psutil",
  "pycryptodome",
  "protobuf==6.33.6",
  "pydantic",
  "grpcio-tools==1.80.0",
  "websockets",
  "httpx[socks]",
  "PySide6==6.11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
endfield-pcap = "endfield_pcap.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
endfield_pcap = ["overlay_assets/*", "overlay_examples/*.html"]
